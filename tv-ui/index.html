<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Só arquivos da própria origem; nenhuma conexão sai desta página.
     Abrir um app é apenas navegar para o endereço oficial dele. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0c0f">
<title>NEXUS TV</title>
<link rel="stylesheet" href="assets/css/nexus.css">
<script src="assets/js/apps.js" defer></script>
<script src="assets/js/nexus.js" defer></script>
</head>
<body>
<div class="screen">

  <header class="topbar">
    <div class="wordmark">NEXUS</div>
    <div class="top-right">
      <a class="icon-btn" href="diag/" id="btn-diag" aria-label="Diagnóstico do sistema" data-title="Diagnóstico"
         data-blurb="Página de testes do navegador e do controle remoto.">⚙</a>
      <button class="icon-btn" type="button" id="btn-reload" aria-label="Recarregar a interface" data-title="Recarregar"
         data-blurb="Recarrega a NEXUS TV.">↻</button>
      <div class="clock" id="clock">--:--</div>
    </div>
  </header>

  <section class="shelf" aria-live="polite">
    <div class="shelf-title" id="shelf-title">Boa noite</div>
    <div class="shelf-blurb" id="shelf-blurb">Escolha um app com o ponteiro ou aperte o número no controle.</div>
    <div class="shelf-meta" id="shelf-meta"></div>
  </section>

  <main class="grid" id="grid"></main>

  <footer class="note">
    Os atalhos abrem os sites oficiais no navegador da TV. Reprodução de vídeo, DRM e alguns recursos podem não funcionar.
  </footer>

  <noscript><div class="noscript">O JavaScript está desativado: os cartões dependem dele para aparecer.</div></noscript>
</div>

<div class="panel-backdrop" id="panel" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <div class="panel-status" id="panel-status"></div>
    <h2 class="panel-title" id="panel-title"></h2>
    <div class="panel-body" id="panel-body"></div>
    <button class="panel-close" type="button" id="panel-close">Fechar</button>
  </div>
</div>

<div class="debug" id="debug" hidden></div>
</body>
</html>
