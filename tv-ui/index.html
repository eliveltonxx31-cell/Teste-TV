<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Scripts e estilos só da própria origem. Imagens: própria origem e o CDN de
     imagens do TMDB. Dados: só a própria origem (/api/home, que guarda a chave). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://image.tmdb.org; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eeeef1">
<title>NEXUS TV</title>
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/nexus.css">
<script src="assets/js/apps.js" defer></script>
<script src="assets/js/nexus.js" defer></script>
</head>
<body>
<div class="screen">

  <header class="head">
    <div class="head-left">
      <h1 class="greet" id="greet">Olá</h1>
      <nav class="tabs" id="tabs" aria-label="Seções">
        <button class="tab is-on" type="button" data-view="home">Destaques</button>
        <button class="tab" type="button" data-view="movies">Filmes</button>
        <button class="tab" type="button" data-view="series">Séries</button>
      </nav>
    </div>
    <div class="head-right">
      <div class="head-btns">
        <button class="circle" type="button" id="btn-credits" aria-label="Créditos e fontes dos dados">i</button>
        <button class="circle" type="button" id="btn-reload" aria-label="Recarregar a interface">↻</button>
        <a class="circle" href="diag/" id="btn-diag" aria-label="Diagnóstico do sistema">⚙</a>
      </div>
      <div class="head-meta">
        <span id="clock">--:--</span><span class="dot">·</span><span id="status">Carregando destaques…</span>
        <button class="retry" type="button" id="btn-retry" hidden>Tentar de novo</button>
      </div>
    </div>
  </header>

  <main class="stage">
    <section class="view-home" id="view-home">
      <div class="slot slot-hero">
        <a class="frame hero is-loading" id="hero">
          <img class="layer" id="hero-a" alt="" decoding="async">
          <img class="layer" id="hero-b" alt="" decoding="async">
        </a>
        <div class="info">
          <div class="info-title" id="hero-title">&nbsp;</div>
          <div class="info-meta" id="hero-meta">&nbsp;</div>
        </div>
      </div>
      <div class="slot slot-rec">
        <a class="frame rec is-loading" id="rec-0"><img class="layer" alt="" decoding="async"></a>
        <div class="info"><div class="info-title">&nbsp;</div><div class="info-meta">&nbsp;</div></div>
      </div>
      <div class="slot slot-rec">
        <a class="frame rec is-loading" id="rec-1"><img class="layer" alt="" decoding="async"></a>
        <div class="info"><div class="info-title">&nbsp;</div><div class="info-meta">&nbsp;</div></div>
      </div>
    </section>

    <section class="view-list" id="view-list" hidden>
      <div class="posters" id="posters"></div>
      <div class="info list-info">
        <div class="info-title" id="list-title">&nbsp;</div>
        <div class="info-meta" id="list-meta">&nbsp;</div>
      </div>
    </section>
  </main>

  <nav class="dock" aria-label="Aplicativos">
    <div class="dock-main" id="dock-main"></div>
    <div class="dock-sep" aria-hidden="true"></div>
    <div class="dock-more" id="dock-more"></div>
  </nav>

  <footer class="credit-line">
    Títulos e imagens: TMDB · disponibilidade por serviço: JustWatch, pode variar · a NEXUS TV não é endossada nem certificada pelo TMDB
  </footer>

  <noscript><div class="noscript">O JavaScript está desativado: a interface depende dele.</div></noscript>
</div>

<div class="panel-backdrop" id="panel" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <div class="panel-status" id="panel-status"></div>
    <h2 class="panel-title" id="panel-title"></h2>
    <div class="panel-body" id="panel-body"></div>
    <button class="panel-close" type="button" id="panel-close">Fechar</button>
  </div>
</div>

<div class="debug" id="debug" hidden></div>
</body>
</html>
